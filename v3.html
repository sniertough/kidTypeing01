<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kid Typing Magic</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111216;
    --panel: #1b1d24;
    --panel-2: #252833;
    --ink: #f7f8ff;
    --muted: #b9becc;
    --line: rgba(255,255,255,.12);
    --accent: #42d6a4;
    --accent-2: #ffd166;
    --danger: #ff6b6b;
    --shadow: 0 24px 70px rgba(0,0,0,.38);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 10%, rgba(66,214,164,.18), transparent 28rem),
      radial-gradient(circle at 88% 18%, rgba(255,209,102,.16), transparent 24rem),
      linear-gradient(135deg, #111216 0%, #181923 52%, #102026 100%);
    color: var(--ink);
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }

  button, input, select {
    font: inherit;
  }

  button {
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 40px;
    padding: 0 14px;
    background: #2b2f3a;
    color: var(--ink);
    cursor: pointer;
  }

  button:hover { background: #343947; }
  button:active { transform: translateY(1px); }

  select, input[type="range"] { accent-color: var(--accent); }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 370px);
    grid-template-rows: auto 1fr;
    gap: 16px;
    height: 100%;
    padding: 16px;
  }

  .toolbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 56px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(27,29,36,.86);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 190px;
    font-size: 18px;
    font-weight: 850;
  }

  .logo {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: linear-gradient(135deg, #42d6a4, #5aa9ff);
    color: #071113;
    font-weight: 950;
  }

  .toolbar label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap;
  }

  .toolbar input[type="checkbox"] {
    width: 18px;
    height: 18px;
  }

  .toolbar .grow { flex: 1; }

  .stage {
    position: relative;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(17,18,22,.62);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  #pad {
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: clamp(18px, 4vw, 42px);
    outline: none;
    overflow: auto;
    font-size: clamp(36px, 6vw, 86px);
    line-height: 1.18;
    word-break: break-word;
    letter-spacing: 0;
  }

  #pad:empty::before {
    content: "กดแป้นพิมพ์ได้เลย";
    color: rgba(255,255,255,.35);
  }

  .letter {
    display: inline-block;
    margin: 0 .025em;
    font-weight: 900;
    animation: pop .18s ease-out;
  }

  .space {
    display: inline-block;
    width: .55em;
  }

  .side {
    display: grid;
    grid-template-rows: minmax(230px, .92fr) minmax(180px, .55fr);
    gap: 16px;
    min-height: 0;
  }

  .result, .recent {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(27,29,36,.88);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .result {
    position: relative;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    align-items: stretch;
  }

  .picture {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), transparent),
      radial-gradient(circle at 50% 58%, rgba(255,255,255,.1), transparent 13rem);
  }

  .picture::after {
    content: "";
    position: absolute;
    inset: auto 12% 11% 12%;
    height: 22px;
    border-radius: 999px;
    background: rgba(0,0,0,.28);
    filter: blur(10px);
  }

  #emoji {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    width: min(72%, 250px);
    aspect-ratio: 1;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;
    background: rgba(255,255,255,.08);
    font-size: clamp(94px, 17vw, 178px);
    transform-origin: center 80%;
    user-select: none;
  }

  .bounce {
    animation: bounce .55s cubic-bezier(.2,.9,.35,1.22);
  }

  .word-box {
    display: grid;
    gap: 6px;
    padding: 18px;
    border-top: 1px solid var(--line);
    background: rgba(11,12,15,.35);
  }

  .word-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  #word {
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: clamp(34px, 5vw, 56px);
    line-height: 1;
    font-weight: 950;
  }

  #score {
    flex: 0 0 auto;
    min-width: 54px;
    color: var(--accent-2);
    font-size: 20px;
    font-weight: 900;
    text-align: right;
  }

  #meaning {
    color: var(--muted);
    font-size: 18px;
  }

  .typed-now {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    color: var(--muted);
    font-size: 14px;
  }

  #buffer {
    min-width: 0;
    color: var(--ink);
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .recent {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .recent-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
  }

  #history {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    min-height: 0;
    padding: 10px;
    overflow: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    min-height: 46px;
    padding: 8px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    background: rgba(255,255,255,.06);
  }

  .history-item span:first-child {
    flex: 0 0 auto;
    font-size: 28px;
  }

  .history-item span:last-child {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 800;
  }

  #spot {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: grid;
    place-items: center;
    pointer-events: none;
    opacity: 0;
    transform: scale(.86);
    transition: opacity .12s ease, transform .12s ease;
    font-size: min(35vw, 260px);
    font-weight: 950;
    text-shadow: 0 18px 55px rgba(0,0,0,.5);
  }

  #spot.show {
    opacity: .72;
    transform: scale(1);
  }

  .confetti {
    position: fixed;
    z-index: 20;
    width: 12px;
    height: 12px;
    border-radius: 4px;
    pointer-events: none;
  }

  @keyframes pop {
    from { transform: translateY(8px) scale(.78); opacity: .2; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  @keyframes bounce {
    0% { transform: translateY(8px) scale(.76) rotate(-4deg); opacity: .35; }
    45% { transform: translateY(-18px) scale(1.08) rotate(3deg); opacity: 1; }
    72% { transform: translateY(4px) scale(.97) rotate(-1deg); }
    100% { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
  }

  @media (max-width: 860px) {
    body { overflow: auto; }
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(42vh, 1fr) auto;
      min-height: 100%;
      height: auto;
    }
    .side {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
    }
    .toolbar {
      align-items: stretch;
      flex-wrap: wrap;
    }
    .brand { min-width: 100%; }
    .toolbar .grow { flex-basis: 100%; }
    #history { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 560px) {
    .app { padding: 10px; gap: 10px; }
    .toolbar { gap: 8px; }
    .toolbar label { font-size: 13px; }
    #history { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
  <main class="app">
    <section class="toolbar" aria-label="controls">
      <div class="brand">
        <div class="logo" aria-hidden="true">Aa</div>
        <div>Kid Typing Magic</div>
      </div>

      <label><input id="speak" type="checkbox" checked /> อ่านออกเสียง</label>
      <label><input id="sound" type="checkbox" checked /> เสียงปุ่ม</label>
      <label>ภาษา
        <select id="voiceLang">
          <option value="en-US" selected>English</option>
          <option value="th-TH">ไทย</option>
        </select>
      </label>
      <label>ช้าเร็ว <input id="rate" type="range" min="0.65" max="1.25" step="0.05" value="0.9" /></label>
      <div class="grow"></div>
      <button id="sayAgain" type="button">อ่านอีกที</button>
      <button id="clear" type="button">ล้าง</button>
      <button id="fullscreen" type="button">เต็มจอ</button>
    </section>

    <section class="stage">
      <div id="pad" tabindex="0" spellcheck="false" aria-label="typing area"></div>
    </section>

    <aside class="side">
      <section class="result" aria-live="polite">
        <div class="picture">
          <div id="emoji" aria-label="picture">✨</div>
        </div>
        <div class="word-box">
          <div class="typed-now">
            <span>ที่กดล่าสุด</span>
            <span id="buffer">เริ่มพิมพ์ได้เลย</span>
          </div>
          <div class="word-row">
            <div id="word">ready</div>
            <div id="score">0%</div>
          </div>
          <div id="meaning">หยุดพิมพ์ 0.5 วินาที แล้วระบบจะเดาคำใกล้เคียง</div>
        </div>
      </section>

      <section class="recent">
        <div class="recent-title">
          <span>คำที่เพิ่งเดา</span>
          <span id="wordCount">0 คำ</span>
        </div>
        <div id="history"></div>
      </section>
    </aside>
  </main>

  <div id="spot"></div>

<script>
  const WORDS = [
    { word: "cat", thai: "แมว", emoji: "🐱", hints: ["cta", "kat", "ca", "ct", "gat"] },
    { word: "dog", thai: "หมา", emoji: "🐶", hints: ["god", "do", "dg", "dag"] },
    { word: "fish", thai: "ปลา", emoji: "🐟", hints: ["fsh", "fis", "fhis", "dish"] },
    { word: "bird", thai: "นก", emoji: "🐦", hints: ["brd", "bir", "birs", "bord"] },
    { word: "duck", thai: "เป็ด", emoji: "🦆", hints: ["duk", "duc", "dck", "buck"] },
    { word: "cow", thai: "วัว", emoji: "🐮", hints: ["co", "cw", "kow"] },
    { word: "pig", thai: "หมู", emoji: "🐷", hints: ["pg", "pik", "big"] },
    { word: "bee", thai: "ผึ้ง", emoji: "🐝", hints: ["be", "b", "vee"] },
    { word: "sun", thai: "พระอาทิตย์", emoji: "☀️", hints: ["sn", "snu", "son"] },
    { word: "moon", thai: "พระจันทร์", emoji: "🌙", hints: ["mon", "moo", "mn"] },
    { word: "star", thai: "ดาว", emoji: "⭐", hints: ["str", "sta", "tar"] },
    { word: "rain", thai: "ฝน", emoji: "🌧️", hints: ["ran", "rin", "rainn"] },
    { word: "tree", thai: "ต้นไม้", emoji: "🌳", hints: ["tre", "tee", "free"] },
    { word: "flower", thai: "ดอกไม้", emoji: "🌸", hints: ["flwer", "flowr", "fower"] },
    { word: "apple", thai: "แอปเปิล", emoji: "🍎", hints: ["aple", "appel", "apl"] },
    { word: "banana", thai: "กล้วย", emoji: "🍌", hints: ["banan", "bana", "bananaaa"] },
    { word: "milk", thai: "นม", emoji: "🥛", hints: ["mil", "mik", "mlk"] },
    { word: "cake", thai: "เค้ก", emoji: "🍰", hints: ["cak", "caek", "kake"] },
    { word: "ball", thai: "ลูกบอล", emoji: "⚽", hints: ["bal", "bll", "boll"] },
    { word: "car", thai: "รถ", emoji: "🚗", hints: ["cr", "kar", "cart"] },
    { word: "bus", thai: "รถบัส", emoji: "🚌", hints: ["bs", "buss", "dus"] },
    { word: "train", thai: "รถไฟ", emoji: "🚂", hints: ["tran", "trai", "tain"] },
    { word: "boat", thai: "เรือ", emoji: "⛵", hints: ["bot", "boar", "baot"] },
    { word: "house", thai: "บ้าน", emoji: "🏠", hints: ["hous", "hose", "home"] },
    { word: "book", thai: "หนังสือ", emoji: "📚", hints: ["bok", "boo", "boook"] },
    { word: "pen", thai: "ปากกา", emoji: "🖊️", hints: ["pn", "pe", "pan"] },
    { word: "hat", thai: "หมวก", emoji: "🧢", hints: ["ha", "ht", "hot"] },
    { word: "shoe", thai: "รองเท้า", emoji: "👟", hints: ["sho", "soe", "shoo"] },
    { word: "hand", thai: "มือ", emoji: "✋", hints: ["han", "had", "hnd"] },
    { word: "baby", thai: "เด็ก", emoji: "👶", hints: ["beby", "bby", "bay"] },
    { word: "happy", thai: "ดีใจ", emoji: "😊", hints: ["hapy", "hap", "hpp"] },
    { word: "sleep", thai: "นอน", emoji: "😴", hints: ["slep", "slp", "seep"] }
  ];

  const pad = document.getElementById("pad");
  const spot = document.getElementById("spot");
  const emoji = document.getElementById("emoji");
  const wordEl = document.getElementById("word");
  const meaningEl = document.getElementById("meaning");
  const scoreEl = document.getElementById("score");
  const bufferEl = document.getElementById("buffer");
  const historyEl = document.getElementById("history");
  const wordCountEl = document.getElementById("wordCount");
  const speakChk = document.getElementById("speak");
  const soundChk = document.getElementById("sound");
  const voiceLang = document.getElementById("voiceLang");
  const rate = document.getElementById("rate");
  const sayAgainBtn = document.getElementById("sayAgain");
  const clearBtn = document.getElementById("clear");
  const fullscreenBtn = document.getElementById("fullscreen");

  let buffer = "";
  let lastResult = WORDS[0];
  let idleTimer = null;
  let spotTimer = null;
  let audioCtx = null;
  let history = [];

  const keyboardNeighbors = {
    q: "wa", w: "qase", e: "wsdr", r: "edft", t: "rfgy", y: "tghu", u: "yhji",
    i: "ujko", o: "iklp", p: "ol", a: "qwsz", s: "awedxz", d: "serfcx",
    f: "drtgvc", g: "ftyhbv", h: "gyujnb", j: "huikmn", k: "jiolm",
    l: "kop", z: "asx", x: "zsdc", c: "xdfv", v: "cfgb", b: "vghn",
    n: "bhjm", m: "njk"
  };

  function randColor() {
    const colors = ["#42d6a4", "#ffd166", "#5aa9ff", "#ff6b6b", "#d7a6ff", "#7be0ff", "#f7f8ff"];
    return colors[Math.floor(Math.random() * colors.length)];
  }

  function cleanInput(value) {
    return value.toLowerCase().replace(/[^a-z]/g, "").slice(-18);
  }

  function trimRepeats(value) {
    return value.replace(/(.)\1{2,}/g, "$1$1");
  }

  function commonLetters(a, b) {
    const count = {};
    for (const ch of a) count[ch] = (count[ch] || 0) + 1;
    let total = 0;
    for (const ch of b) {
      if (count[ch] > 0) {
        total++;
        count[ch]--;
      }
    }
    return total;
  }

  function keyboardBonus(input, target) {
    let score = 0;
    const len = Math.min(input.length, target.length);
    for (let i = 0; i < len; i++) {
      if (input[i] === target[i]) score += 1;
      else if (keyboardNeighbors[target[i]]?.includes(input[i])) score += .45;
    }
    return score / Math.max(target.length, 1);
  }

  function editDistance(a, b) {
    const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
    for (let i = 0; i <= a.length; i++) dp[i][0] = i;
    for (let j = 0; j <= b.length; j++) dp[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(
          dp[i - 1][j] + 1,
          dp[i][j - 1] + 1,
          dp[i - 1][j - 1] + cost
        );
      }
    }
    return dp[a.length][b.length];
  }

  function scoreWord(rawInput, item) {
    const input = trimRepeats(cleanInput(rawInput));
    if (!input) return 0;

    const variants = [item.word, ...item.hints];
    let best = 0;
    for (const variant of variants) {
      const target = cleanInput(variant);
      const distance = editDistance(input, target);
      const distanceScore = 1 - distance / Math.max(input.length, target.length, 1);
      const overlapScore = commonLetters(input, target) / Math.max(target.length, 1);
      const prefixScore = target.startsWith(input) || input.startsWith(target) ? .28 : 0;
      const containsScore = target.includes(input) || input.includes(target) ? .2 : 0;
      const keyScore = keyboardBonus(input, target);
      const lengthPenalty = Math.min(Math.abs(input.length - target.length) * .035, .18);
      const score = distanceScore * .58 + overlapScore * .22 + keyScore * .22 + prefixScore + containsScore - lengthPenalty;
      best = Math.max(best, score);
    }
    return Math.max(0, Math.min(1, best));
  }

  function guessWord(rawInput) {
    const ranked = WORDS
      .map(item => ({ item, score: scoreWord(rawInput, item) }))
      .sort((a, b) => b.score - a.score);
    return ranked[0];
  }

  function speak(text, lang = voiceLang.value) {
    if (!speakChk.checked || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = Number(rate.value);
    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang === lang) || voices.find(v => v.lang.startsWith(lang.slice(0, 2)));
    if (voice) utterance.voice = voice;
    window.speechSynthesis.speak(utterance);
  }

  function speakResult(item) {
    const text = voiceLang.value === "th-TH" ? item.thai : item.word;
    speak(text, voiceLang.value);
  }

  function beep(ch) {
    if (!soundChk.checked) return;
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const code = ch.toLowerCase().charCodeAt(0) || 97;
    const note = Number.isFinite(code) ? Math.max(0, Math.min(24, code - 97)) : 0;
    osc.type = "triangle";
    osc.frequency.value = 240 * Math.pow(2, note / 18);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.1, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.18);
  }

  function showSpot(ch, color) {
    spot.textContent = ch.toUpperCase();
    spot.style.color = color;
    spot.classList.add("show");
    clearTimeout(spotTimer);
    spotTimer = setTimeout(() => spot.classList.remove("show"), 130);
  }

  function burst(x = window.innerWidth / 2, y = window.innerHeight / 2) {
    for (let i = 0; i < 22; i++) {
      const dot = document.createElement("div");
      dot.className = "confetti";
      dot.style.left = `${x}px`;
      dot.style.top = `${y}px`;
      dot.style.background = randColor();
      document.body.appendChild(dot);
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 8;
      const rotate = Math.random() * 540 - 270;
      let frame = 0;
      const tick = () => {
        frame++;
        const fade = 1 - frame / 34;
        dot.style.opacity = String(Math.max(0, fade));
        dot.style.transform = `translate(${Math.cos(angle) * speed * frame}px, ${Math.sin(angle) * speed * frame + frame * 1.6}px) rotate(${rotate * frame / 34}deg) scale(${Math.max(.2, fade)})`;
        if (frame < 34) requestAnimationFrame(tick);
        else dot.remove();
      };
      requestAnimationFrame(tick);
    }
  }

  function addLetter(ch) {
    const color = randColor();
    const span = document.createElement("span");
    span.className = ch === " " ? "space" : "letter";
    span.textContent = ch === " " ? " " : ch;
    span.style.color = color;
    pad.appendChild(span);
    pad.scrollTop = pad.scrollHeight;
    if (ch !== " ") showSpot(ch, color);
    beep(ch);
  }

  function setResult(item, score) {
    lastResult = item;
    emoji.textContent = item.emoji;
    emoji.classList.remove("bounce");
    void emoji.offsetWidth;
    emoji.classList.add("bounce");
    wordEl.textContent = item.word;
    meaningEl.textContent = item.thai;
    scoreEl.textContent = `${Math.round(score * 100)}%`;
    history = [item, ...history.filter(entry => entry.word !== item.word)].slice(0, 10);
    renderHistory();
    burst();
    speakResult(item);
  }

  function renderHistory() {
    wordCountEl.textContent = `${history.length} คำ`;
    historyEl.innerHTML = "";
    for (const item of history) {
      const row = document.createElement("button");
      row.className = "history-item";
      row.type = "button";
      row.innerHTML = `<span aria-hidden="true">${item.emoji}</span><span>${item.word}</span>`;
      row.addEventListener("click", () => {
        buffer = item.word;
        bufferEl.textContent = buffer;
        setResult(item, 1);
      });
      historyEl.appendChild(row);
    }
  }

  function scheduleGuess() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const clean = cleanInput(buffer);
      if (!clean) return;
      const result = guessWord(clean);
      setResult(result.item, result.score);
      buffer = "";
      bufferEl.textContent = "รอคำต่อไป";
    }, 500);
  }

  function clearAll() {
    buffer = "";
    pad.innerHTML = "";
    bufferEl.textContent = "เริ่มพิมพ์ได้เลย";
    scoreEl.textContent = "0%";
    wordEl.textContent = "ready";
    meaningEl.textContent = "หยุดพิมพ์ 0.5 วินาที แล้วระบบจะเดาคำใกล้เคียง";
    emoji.textContent = "✨";
    pad.focus();
  }

  pad.addEventListener("keydown", event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;

    if (event.key === "Backspace") {
      event.preventDefault();
      buffer = buffer.slice(0, -1);
      bufferEl.textContent = buffer || "เริ่มพิมพ์ได้เลย";
      const last = pad.lastChild;
      if (last) last.remove();
      scheduleGuess();
      return;
    }

    if (event.key === "Enter") {
      event.preventDefault();
      pad.appendChild(document.createElement("br"));
      buffer = "";
      bufferEl.textContent = "ขึ้นบรรทัดใหม่";
      burst();
      return;
    }

    if (event.key.length !== 1) return;

    event.preventDefault();
    const ch = event.key;
    addLetter(ch);
    if (/[a-z]/i.test(ch)) {
      buffer += ch.toLowerCase();
      bufferEl.textContent = buffer;
      scheduleGuess();
    } else if (ch === " ") {
      scheduleGuess();
    }
  });

  document.addEventListener("pointerdown", () => pad.focus());

  sayAgainBtn.addEventListener("click", () => {
    speakResult(lastResult);
    pad.focus();
  });

  clearBtn.addEventListener("click", clearAll);

  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
    pad.focus();
  });

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }

  pad.focus();
</script>
</body>
</html>
